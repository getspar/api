<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>API Finder Pro Max</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(180deg, #1A1A2E, #16213E, #0F0F1E);
  min-height: 100vh;
  color: #fff;
  padding: 15px;
  padding-top: env(safe-area-inset-top, 15px);
  padding-bottom: env(safe-area-inset-bottom, 15px);
  overflow-x: hidden;
}
.header { text-align: center; margin-bottom: 20px; }
.header h1 {
  font-size: 22px;
  background: linear-gradient(90deg, #00D2FF, #3A7BD5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}
.header p { font-size: 12px; color: #888; margin-top: 5px; }
.input-box {
  display: flex;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 5px;
  margin-bottom: 12px;
}
.input-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  padding: 12px;
  font-size: 14px;
  direction: ltr;
  text-align: left;
}
.input-box input::placeholder { color: #555; }
.input-box button {
  background: linear-gradient(135deg, #00D2FF, #3A7BD5);
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
.methods {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.methods::-webkit-scrollbar { display: none; }
.method-btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #888;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer;
  transition: 0.2s;
}
.method-btn.active {
  background: linear-gradient(135deg, #00D2FF, #3A7BD5);
  color: #fff;
  border-color: transparent;
}
.actions {
  display: flex;
  justify-content: space-around;
  margin: 15px 0;
}
.circle-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.circle-btn .circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
  transition: 0.2s;
}
.circle-btn:active .circle { transform: scale(0.9); }
.circle-red { background: linear-gradient(135deg, #FF4757, #c0392b); }
.circle-green { background: linear-gradient(135deg, #00FF88, #00b36b); }
.circle-pink { background: linear-gradient(135deg, #FF6B9D, #c44569); }
.circle-btn span { font-size: 11px; color: #ccc; }
.tabs {
  display: flex;
  justify-content: space-around;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 15px;
}
.tabs button {
  background: transparent;
  border: none;
  color: #888;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
}
.tabs button.active { color: #00D2FF; background: rgba(0,210,255,0.1); }
.info-cards {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  display: none;
}
.info-cards.show { display: flex; }
.info-card {
  flex: 1;
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 10px;
  border-left: 3px solid #00D2FF;
  text-align: center;
}
.info-card .label { font-size: 10px; color: #888; }
.info-card .value { font-size: 14px; font-weight: bold; color: #00D2FF; margin-top: 3px; }
.info-card.success { border-left-color: #00FF88; }
.info-card.success .value { color: #00FF88; }
.info-card.error { border-left-color: #FF4757; }
.info-card.error .value { color: #FF4757; }
.output {
  background: #0A0A15;
  border-radius: 12px;
  padding: 15px;
  min-height: 300px;
  max-height: 55vh;
  overflow-y: auto;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  direction: ltr;
  text-align: left;
  border: 1px solid rgba(255,255,255,0.05);
}
.output .key { color: #00D2FF; }
.output .string { color: #00FF88; }
.output .number { color: #FFA502; }
.output .bool { color: #FF6B81; }
.loading {
  text-align: center;
  padding: 20px;
  display: none;
}
.loading.show { display: block; }
.spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid rgba(0,210,255,0.2);
  border-top-color: #00D2FF;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: bold;
  margin: 2px;
}
.footer-note {
  text-align: center;
  font-size: 11px;
  color: #555;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ API Finder Pro Max</h1>
  <p>کاوشگر حرفه‌ای API + JSON</p>
</div>

<div class="input-box">
  <input type="text" id="urlInput" placeholder="https://example.com/api" value="https://jsonplaceholder.typicode.com/posts/1">
  <button onclick="fetchApi()">→</button>
</div>

<div class="methods" id="methods">
  <button class="method-btn active" data-method="GET">GET</button>
  <button class="method-btn" data-method="POST">POST</button>
  <button class="method-btn" data-method="PUT">PUT</button>
  <button class="method-btn" data-method="DELETE">DELETE</button>
  <button class="method-btn" data-method="PATCH">PATCH</button>
</div>

<div class="actions">
  <div class="circle-btn" onclick="fetchApi()">
    <div class="circle circle-red">▶</div>
    <span>فعال سازی</span>
  </div>
  <div class="circle-btn" onclick="document.getElementById('urlInput').value='https://example.com'">
    <div class="circle circle-green">&lt;/&gt;</div>
    <span>HTML</span>
  </div>
  <div class="circle-btn" onclick="showApisList()">
    <div class="circle circle-pink">📡</div>
    <span>APIها</span>
  </div>
</div>

<div class="info-cards" id="infoCards">
  <div class="info-card" id="methodCard">
    <div class="label">متد</div>
    <div class="value" id="methodValue">-</div>
  </div>
  <div class="info-card" id="statusCard">
    <div class="label">وضعیت</div>
    <div class="value" id="statusValue">-</div>
  </div>
  <div class="info-card">
    <div class="label">زمان</div>
    <div class="value" id="timeValue">-</div>
  </div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p style="margin-top:10px; color:#00D2FF; font-size:12px;">در حال دریافت و رمزگشایی...</p>
</div>

<div class="tabs" id="tabs" style="display:none;">
  <button class="active" onclick="renderView('decoded', this)">رمزگشایی شده</button>
  <button onclick="renderView('raw', this)">خام</button>
  <button onclick="renderView('headers', this)">هدرها</button>
</div>

<div class="output" id="output">
  <span style="color:#555;">نتیجه اینجا نمایش داده می‌شود...</span>
</div>

<div class="footer-note">ساخته شده با ❤️ برای کاوش APIها</div>

<script>
let selectedMethod = 'GET';
let rawText = '';
let decodedData = null;
let headersData = {};

// انتخاب متد
document.querySelectorAll('.method-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMethod = btn.dataset.method;
  });
});

// تابع اصلی دریافت API
async function fetchApi() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { alert('لطفا آدرس را وارد کنید'); return; }
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    alert('آدرس باید با http یا https شروع شود');
    return;
  }

  const loading = document.getElementById('loading');
  const output = document.getElementById('output');
  const infoCards = document.getElementById('infoCards');
  const tabs = document.getElementById('tabs');

  loading.classList.add('show');
  infoCards.classList.remove('show');
  tabs.style.display = 'none';
  output.innerHTML = '<span style="color:#555;">در حال دریافت...</span>';

  const startTime = performance.now();

  try {
    // استفاده از پروکسی برای دور زدن CORS
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    const response = await fetch(proxyUrl);
    const endTime = performance.now();
    const responseTime = Math.round(endTime - startTime);

    rawText = await response.text();
    headersData = {};
    response.headers.forEach((v, k) => headersData[k] = v);

    loading.classList.remove('show');
    infoCards.classList.add('show');
    tabs.style.display = 'flex';

    // نمایش اطلاعات
    document.getElementById('methodValue').textContent = selectedMethod;
    const statusCard = document.getElementById('statusCard');
    document.getElementById('statusValue').textContent = response.status;
    statusCard.className = 'info-card ' + (response.ok ? 'success' : 'error');
    document.getElementById('timeValue').textContent = responseTime + 'ms';

    // رمزگشایی
    decodedData = decodeResponse(rawText, headersData['content-type'] || '');

    // نمایش تب اول
    renderView('decoded', document.querySelector('.tabs button'));

  } catch (error) {
    loading.classList.remove('show');
    output.innerHTML = '<span style="color:#FF4757;">❌ خطا:\n' + error.message + '\n\n💡 ممکنه سایت مقصد CORS رو مسدود کرده باشه یا آدرس اشتباه باشه.</span>';
  }
}

// رمزگشایی هوشمند
function decodeResponse(text, contentType) {
  if (!text) return { type: 'empty', text: 'پاسخ خالی است' };

  // JSON
  try {
    const json = JSON.parse(text);
    return { type: 'json', data: json };
  } catch (e) {}

  // Base64
  try {
    if (/^[A-Za-z0-9+/=\s]+$/.test(text) && text.replace(/\s/g, '').length % 4 === 0) {
      const decoded = atob(text.replace(/\s/g, ''));
      if (/^[\x20-\x7E\s\u0600-\u06FF]+$/.test(decoded)) {
        try {
          return { type: 'base64-json', data: JSON.parse(decoded) };
        } catch (e) {
          return { type: 'base64', text: decoded };
        }
      }
    }
  } catch (e) {}

  // URL Encoded
  if (/%[0-9A-Fa-f]{2}/.test(text)) {
    try {
      const dec = decodeURIComponent(text);
      if (dec !== text) return { type: 'url', text: dec };
    } catch (e) {}
  }

  // HTML
  if (contentType.indexOf('html') > -1 || /<html|<div|<body/i.test(text)) {
    const div = document.createElement('div');
    div.innerHTML = text;
    return { type: 'html', text: (div.textContent || '').trim() };
  }

  return { type: 'text', text: text };
}

// نمایش تب‌ها
function renderView(view, btn) {
  if (btn) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  const output = document.getElementById('output');

  if (view === 'decoded') {
    if (decodedData && decodedData.data) {
      output.innerHTML = syntaxHighlight(decodedData.data);
    } else if (decodedData && decodedData.text) {
      output.innerHTML = '<span style="color:#00FF88;">' + escapeHtml(decodedData.text) + '</span>';
    } else {
      output.innerHTML = '<span style="color:#555;">داده‌ای نیست</span>';
    }
  } else if (view === 'raw') {
    output.innerHTML = escapeHtml(rawText);
  } else if (view === 'headers') {
    let html = '';
    for (let k in headersData) {
      html += '<span class="key">' + escapeHtml(k) + '</span>: <span class="string">' + escapeHtml(headersData[k]) + '</span>\n';
    }
    output.innerHTML = html || 'هدری یافت نشد';
  }
}

// رنگی کردن JSON
function syntaxHighlight(json) {
  if (typeof json !== 'object' || json === null) return escapeHtml(String(json));
  let str = JSON.stringify(json, null, 2);
  str = escapeHtml(str);
  return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (m) {
    let cls = 'number';
    if (/^"/.test(m)) {
      cls = /:$/.test(m) ? 'key' : 'string';
    } else if (/true|false/.test(m)) {
      cls = 'bool';
    } else if (/null/.test(m)) {
      cls = 'number';
    }
    return '<span class="' + cls + '">' + m + '</span>';
  });
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// دکمه APIها
function showApisList() {
  const apis = [
    'https://jsonplaceholder.typicode.com/posts/1',
    'https://jsonplaceholder.typicode.com/users',
    'https://jsonplaceholder.typicode.com/comments',
    'https://api.github.com/users/github',
    'https://api.github.com/repos/flutter/flutter'
  ];
  const randomApi = apis[Math.floor(Math.random() * apis.length)];
  document.getElementById('urlInput').value = randomApi;
  alert('یه API تصادفی انتخاب شد! دکمه فعال سازی رو بزن.');
}

// Enter
document.getElementById('urlInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') fetchApi();
});
</script>
</body>
</html>
