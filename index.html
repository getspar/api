<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A1A2E">
<title>API Finder Pro Max</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(180deg, #1A1A2E, #16213E, #0F0F1E);
  min-height: 100vh;
  color: #fff;
  padding: 15px;
}
.header { text-align: center; margin-bottom: 20px; }
.header h1 {
  font-size: 22px;
  background: linear-gradient(90deg, #00D2FF, #3A7BD5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}
.header p { font-size: 12px; color: #888; margin-top: 5px; }
.input-box {
  display: flex;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 5px;
  margin-bottom: 12px;
}
.input-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  padding: 12px;
  font-size: 13px;
  direction: ltr;
  text-align: left;
}
.input-box input::placeholder { color: #555; }
.input-box button {
  background: linear-gradient(135deg, #00D2FF, #3A7BD5);
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.methods {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.methods::-webkit-scrollbar { display: none; }
.method-btn {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #888;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer;
}
.method-btn.active {
  background: linear-gradient(135deg, #00D2FF, #3A7BD5);
  color: #fff;
  border-color: transparent;
}
.actions {
  display: flex;
  justify-content: space-around;
  margin: 15px 0;
}
.circle-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.circle-btn .circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
  transition: 0.2s;
}
.circle-btn:active .circle { transform: scale(0.9); }
.circle-red { background: linear-gradient(135deg, #FF4757, #c0392b); }
.circle-green { background: linear-gradient(135deg, #00FF88, #00b36b); }
.circle-pink { background: linear-gradient(135deg, #FF6B9D, #c44569); }
.circle-btn span { font-size: 11px; color: #ccc; }
.info-cards {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  display: none;
}
.info-cards.show { display: flex; }
.info-card {
  flex: 1;
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 10px;
  border-left: 3px solid #00D2FF;
  text-align: center;
}
.info-card .label { font-size: 10px; color: #888; }
.info-card .value { font-size: 13px; font-weight: bold; color: #00D2FF; margin-top: 3px; }
.info-card.success { border-left-color: #00FF88; }
.info-card.success .value { color: #00FF88; }
.info-card.error { border-left-color: #FF4757; }
.info-card.error .value { color: #FF4757; }
.output {
  background: #0A0A15;
  border-radius: 12px;
  padding: 15px;
  min-height: 300px;
  max-height: 55vh;
  overflow-y: auto;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  direction: ltr;
  text-align: left;
  border: 1px solid rgba(255,255,255,0.05);
}
.output .key { color: #00D2FF; }
.output .string { color: #00FF88; }
.output .number { color: #FFA502; }
.output .bool { color: #FF6B81; }
.loading {
  text-align: center;
  padding: 20px;
  display: none;
}
.loading.show { display: block; }
.spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid rgba(0,210,255,0.2);
  border-top-color: #00D2FF;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.footer-note {
  text-align: center;
  font-size: 11px;
  color: #555;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ API Finder Pro Max</h1>
  <p>کاوشگر حرفه‌ای API + JSON</p>
</div>

<div class="input-box">
  <input type="text" id="urlInput" placeholder="https://jsonplaceholder.typicode.com/posts/1" value="https://jsonplaceholder.typicode.com/posts/1">
  <button onclick="fetchApi()">→</button>
</div>

<div class="methods" id="methods">
  <button class="method-btn active" data-method="GET">GET</button>
  <button class="method-btn" data-method="POST">POST</button>
  <button class="method-btn" data-method="PUT">PUT</button>
  <button class="method-btn" data-method="DELETE">DELETE</button>
  <button class="method-btn" data-method="PATCH">PATCH</button>
</div>

<div class="actions">
  <div class="circle-btn" onclick="fetchApi()">
    <div class="circle circle-red">▶</div>
    <span>فعال سازی</span>
  </div>
  <div class="circle-btn" onclick="testDemo()">
    <div class="circle circle-green">🧪</div>
    <span>تست</span>
  </div>
  <div class="circle-btn" onclick="showHelp()">
    <div class="circle circle-pink">❓</div>
    <span>راهنما</span>
  </div>
</div>

<div class="info-cards" id="infoCards">
  <div class="info-card">
    <div class="label">متد</div>
    <div class="value" id="methodValue">-</div>
  </div>
  <div class="info-card" id="statusCard">
    <div class="label">وضعیت</div>
    <div class="value" id="statusValue">-</div>
  </div>
  <div class="info-card">
    <div class="label">زمان</div>
    <div class="value" id="timeValue">-</div>
  </div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p style="margin-top:10px; color:#00D2FF; font-size:12px;" id="loadingText">در حال دریافت...</p>
</div>

<div class="output" id="output">
  <span style="color:#555;">نتیجه اینجا نمایش داده می‌شود...</span>
</div>

<div class="footer-note">ساخته شده با ❤️ برای کاوش APIها</div>

<script>
let selectedMethod = 'GET';
let rawText = '';
let decodedData = null;
let headersData = {};

document.querySelectorAll('.method-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMethod = btn.dataset.method;
  });
});

// ============ لیست پروکسی‌های معتبر ============
// ترتیب: سریع‌ترین و پایدارترین اول
const PROXIES = [
  (url) => 'https://corsproxy.io/?' + encodeURIComponent(url),
  (url) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  (url) => 'https://thingproxy.freeboard.io/fetch/' + url,
  (url) => 'https://cors-anywhere.herokuapp.com/' + url,
];

async function fetchWithFallback(url) {
  let lastError = null;
  for (let i = 0; i < PROXIES.length; i++) {
    try {
      document.getElementById('loadingText').textContent = 
        'تلاش ' + (i+1) + ' از ' + PROXIES.length + '...';
      
      const proxyUrl = PROXIES[i](url);
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      
      const response = await fetch(proxyUrl, { 
        signal: controller.signal,
        method: 'GET',
        headers: { 'Accept': 'application/json, text/plain, */*' }
      });
      
      clearTimeout(timeout);
      
      // اگه خطای شبکه نبود، برمی‌گردونیم
      if (response.status < 500) {
        return response;
      }
    } catch (e) {
      console.log('پروکسی ' + (i+1) + ' ناموفق:', e.message);
      lastError = e;
      continue;
    }
  }
  throw lastError || new Error('همه پروکسی‌ها ناموفق بودند');
}

// ============ دریافت API ============
async function fetchApi() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { alert('لطفا آدرس را وارد کن'); return; }
  if (!url.startsWith('http')) { alert('آدرس باید با http یا https شروع شود'); return; }

  const loading = document.getElementById('loading');
  const output = document.getElementById('output');
  const infoCards = document.getElementById('infoCards');

  loading.classList.add('show');
  infoCards.classList.remove('show');
  output.innerHTML = '<span style="color:#555;">در حال دریافت...</span>';

  const startTime = performance.now();

  try {
    const response = await fetchWithFallback(url);
    const endTime = performance.now();
    const responseTime = Math.round(endTime - startTime);

    rawText = await response.text();
    headersData = {};
    response.headers.forEach((v, k) => headersData[k] = v);

    loading.classList.remove('show');
    infoCards.classList.add('show');

    document.getElementById('methodValue').textContent = selectedMethod;
    const statusCard = document.getElementById('statusCard');
    document.getElementById('statusValue').textContent = response.status;
    statusCard.className = 'info-card ' + (response.ok ? 'success' : 'error');
    document.getElementById('timeValue').textContent = responseTime + 'ms';

    decodedData = decodeResponse(rawText, headersData['content-type'] || '');
    renderOutput();

  } catch (error) {
    loading.classList.remove('show');
    output.innerHTML = 
      '<span style="color:#FF4757;">❌ خطا: ' + escapeHtml(error.message) + '\n\n' +
      '💡 راه‌حل‌ها:\n' +
      '1. اتصال اینترنتت رو چک کن\n' +
      '2. یه API دیگه امتحان کن (دکمه «تست» رو بزن)\n' +
      '3. VPN رو روشن/خاموش کن\n' +
      '4. چند دقیقه بعد دوباره امتحان کن</span>';
  }
}

// ============ تست خودکار ============
async function testDemo() {
  const demos = [
    'https://jsonplaceholder.typicode.com/posts/1',
    'https://api.github.com/users/github',
    'https://dog.ceo/api/breeds/image/random',
  ];
  
  const output = document.getElementById('output');
  let html = '<span style="color:#00D2FF;">🧪 در حال تست پروکسی‌ها...\n\n</span>';
  output.innerHTML = html;
  document.getElementById('loading').classList.add('show');

  for (let i = 0; i < demos.length; i++) {
    try {
      document.getElementById('loadingText').textContent = 'تست API ' + (i+1) + '...';
      const start = performance.now();
      const response = await fetchWithFallback(demos[i]);
      const end = performance.now();
      const text = await response.text();
      
      html += '<span style="color:#00FF88;">✅ ' + demos[i] + '\n';
      html += '   وضعیت: ' + response.status + ' | زمان: ' + Math.round(end-start) + 'ms</span>\n\n';
    } catch (e) {
      html += '<span style="color:#FF4757;">❌ ' + demos[i] + '\n';
      html += '   خطا: ' + e.message + '</span>\n\n';
    }
    output.innerHTML = html;
  }

  document.getElementById('loading').classList.remove('show');
  html += '<span style="color:#FFA502;">\n💡 اگه همه تست‌ها موفق بودن، یعنی اینترنت و پروکسی‌ها OK هستن.</span>';
  output.innerHTML = html;
}

// ============ راهنما ============
function showHelp() {
  const output = document.getElementById('output');
  output.innerHTML = `<span style="color:#00D2FF; font-size:14px;">📖 راهنما\n\n</span>
<span style="color:#00FF88;">1.</span> آدرس API رو توی کادر بالا وارد کن
   مثال: https://jsonplaceholder.typicode.com/posts/1

<span style="color:#00FF88;">2.</span> متد رو انتخاب کن (GET, POST, ...)

<span style="color:#00FF88;">3.</span> دکمه <span style="color:#FF4757;">▶ فعال سازی</span> رو بزن

<span style="color:#00FF88;">4.</span> نتیجه به صورت خودکار رمزگشایی می‌شه

<span style="color:#FFA502;">🔓 رمزگشایی‌های پشتیبانی شده:</span>
   • JSON (مرتب و رنگی)
   • Base64
   • URL Encoding
   • HTML (تبدیل به متن)

<span style="color:#FFA502;">💡 نکته:</span> اگه خطا دیدی، دکمه «تست» رو بزن تا ببینی مشکل از چیه.

<span style="color:#FFA502;">📌 اگه همه پروکسی‌ها خطا دادن:</span>
   • اینترنتت رو چک کن
   • VPN رو روشن کن
   • یا چند دقیقه بعد امتحان کن`;
}

// ============ رمزگشایی ============
function decodeResponse(text, contentType) {
  if (!text) return { type: 'empty', text: 'پاسخ خالی است' };

  try {
    const json = JSON.parse(text);
    return { type: 'json', data: json };
  } catch (e) {}

  try {
    if (/^[A-Za-z0-9+/=\s]+$/.test(text) && text.replace(/\s/g, '').length % 4 === 0) {
      const decoded = atob(text.replace(/\s/g, ''));
      if (/^[\x20-\x7E\s\u0600-\u06FF]+$/.test(decoded)) {
        try {
          return { type: 'base64-json', data: JSON.parse(decoded) };
        } catch (e) {
          return { type: 'base64', text: decoded };
        }
      }
    }
  } catch (e) {}

  if (/%[0-9A-Fa-f]{2}/.test(text)) {
    try {
      const dec = decodeURIComponent(text);
      if (dec !== text) return { type: 'url', text: dec };
    } catch (e) {}
  }

  if (contentType.indexOf('html') > -1 || /<html|<div|<body/i.test(text)) {
    const div = document.createElement('div');
    div.innerHTML = text;
    return { type: 'html', text: (div.textContent || '').trim() };
  }

  return { type: 'text', text: text };
}

function renderOutput() {
  const output = document.getElementById('output');
  if (decodedData && decodedData.data) {
    output.innerHTML = syntaxHighlight(decodedData.data);
  } else if (decodedData && decodedData.text) {
    output.innerHTML = '<span style="color:#00FF88;">' + escapeHtml(decodedData.text) + '</span>';
  } else {
    output.innerHTML = '<span style="color:#555;">داده‌ای نیست</span>';
  }
}

function syntaxHighlight(json) {
  if (typeof json !== 'object' || json === null) return escapeHtml(String(json));
  let str = JSON.stringify(json, null, 2);
  str = escapeHtml(str);
  return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (m) {
    let cls = 'number';
    if (/^"/.test(m)) cls = /:$/.test(m) ? 'key' : 'string';
    else if (/true|false/.test(m)) cls = 'bool';
    return '<span class="' + cls + '">' + m + '</span>';
  });
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

document.getElementById('urlInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') fetchApi();
});
</script>
</body>
</html>
